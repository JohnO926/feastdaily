name: FeastDaily
options:
  bundleIdPrefix: com.valiflo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  FeastCore:
    path: Packages/FeastCore
  TelemetryDeck:
    url: https://github.com/TelemetryDeck/SwiftSDK
    from: "2.0.0"
targets:
  FeastDaily:
    type: application
    platform: iOS
    sources:
      - path: FeastDaily
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.valiflo.feastdaily
        PRODUCT_NAME: Feast Daily
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: FeastDaily/FeastDaily.$(FD_DEBUG_ENTITLEMENTS).entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: FeastDaily/FeastDaily.Release.entitlements
    info:
      path: FeastDaily/Info.plist
      properties:
        CFBundleDisplayName: Feast Daily
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: com.valiflo.feastdaily
            CFBundleURLSchemes: [feastdaily]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Feast Daily connects to a development server on your network.
        UIBackgroundModes: [remote-notification]
        FDAPIBaseURL: $(API_BASE_URL)
        FDAlarmMode: $(ALARM_MODE)
        FDTelemetryDeckAppID: $(TELEMETRYDECK_APP_ID)
        FDPrivacyPolicyURL: $(PRIVACY_POLICY_URL)
        FDKeychainAccessGroup: $(AppIdentifierPrefix)com.valiflo.feastdaily.shared
    dependencies:
      - package: FeastCore
        product: FeastCore
      - package: FeastCore
        product: FeastScripture
      - package: TelemetryDeck
        product: TelemetryDeck
      - target: FeastDailyWidget
    postBuildScripts:
      - name: Strip extended attributes (iCloud Desktop)
        script: xattr -cr "${TARGET_BUILD_DIR}/${WRAPPER_NAME}" || true
        basedOnDependencyAnalysis: false
  FeastDailyWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: FeastDailyWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.valiflo.feastdaily.widget
        PRODUCT_NAME: FeastDailyWidget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: FeastDailyWidget/FeastDailyWidget.entitlements
        SKIP_INSTALL: YES
    info:
      path: FeastDailyWidget/Info.plist
      properties:
        CFBundleDisplayName: Feast Daily
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        FDAPIBaseURL: $(API_BASE_URL)
        FDKeychainAccessGroup: $(AppIdentifierPrefix)com.valiflo.feastdaily.shared
    dependencies:
      - package: FeastCore
        product: FeastCore
  FeastDailyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FeastDailyTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Feast Daily.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Feast Daily
    dependencies:
      - target: FeastDaily
  FeastDailyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [FeastDailyUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FeastDaily
    dependencies:
      - target: FeastDaily
schemes:
  FeastDaily:
    build:
      targets:
        FeastDaily: all
        FeastDailyWidget: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [FeastDailyTests, FeastDailyUITests]
